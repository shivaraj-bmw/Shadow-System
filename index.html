<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE SYSTEM // Hunter Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Great+Vibes&display=swap');

:root{
  --bg:#05070d;
  --panel:#0b1019;
  --panel2:#0e1420;
  --accent-rgb:77,232,255;
  --gold-rgb:255,184,77;
  --line:rgba(var(--accent-rgb),0.22);
  --line-soft:rgba(var(--accent-rgb),0.10);
  --blue:#4de8ff;
  --blue-dim:#2a7f94;
  --violet:#8b6bff;
  --gold:#ffb84d;
  --red:#ff5468;
  --green:#48e08a;
  --text:#c9d3e3;
  --dim:#5c6785;
  --mono:'JetBrains Mono',monospace;
  --display:'Orbitron',sans-serif;
  --ui:'Rajdhani',sans-serif;
  --body:'Inter',sans-serif;
  --sign:'Great Vibes',cursive;
}
/* ---------- Theme variants ----------
   Switching data-theme on <html> recolors the whole UI —
   including the license/certificate — since every accent
   color below is driven by these variables. */
html[data-theme="red"]{
  --accent-rgb:255,84,104;
  --blue:#ff5468;
  --blue-dim:#8a2c38;
  --gold-rgb:255,138,92;
  --gold:#ff8a5c;
}
html[data-theme="green"]{
  --accent-rgb:72,224,138;
  --blue:#48e08a;
  --blue-dim:#1f7a4c;
  --gold-rgb:201,232,122;
  --gold:#c9e87a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  position:relative;
  background:
    radial-gradient(ellipse 1000px 560px at 50% -8%, rgba(var(--accent-rgb),0.16), transparent 62%),
    radial-gradient(circle at 12% 88%, rgba(var(--accent-rgb),0.07), transparent 42%),
    radial-gradient(circle at 88% 15%, rgba(139,107,255,0.08), transparent 40%),
    radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1.4px) 0 0/38px 38px,
    var(--bg);
  color:var(--text);
  font-family:var(--body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
/* Faint rotating summon-circle watermark, recolors with the active theme */
body::before{
  content:"";
  position:fixed;
  top:50%;left:50%;
  width:min(900px,140vw);height:min(900px,140vw);
  transform:translate(-50%,-50%);
  background-color:rgba(var(--accent-rgb),0.5);
  -webkit-mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><g fill="none" stroke="white" stroke-width="0.6"><circle cx="100" cy="100" r="94"/><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="66"/><path d="M100 6 L100 194 M6 100 L194 100"/><path d="M100 20 L112 88 L180 100 L112 112 L100 180 L88 112 L20 100 L88 88 Z"/><circle cx="100" cy="100" r="4" fill="white" stroke="none"/></g></svg>');
  mask-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><g fill="none" stroke="white" stroke-width="0.6"><circle cx="100" cy="100" r="94"/><circle cx="100" cy="100" r="80"/><circle cx="100" cy="100" r="66"/><path d="M100 6 L100 194 M6 100 L194 100"/><path d="M100 20 L112 88 L180 100 L112 112 L100 180 L88 112 L20 100 L88 88 Z"/><circle cx="100" cy="100" r="4" fill="white" stroke="none"/></g></svg>');
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  opacity:0.08;
  pointer-events:none;
  z-index:0;
  animation:summonSpin 120s linear infinite;
}
@keyframes summonSpin{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
.wrap,#toast-root{position:relative;z-index:1;}
::selection{background:rgba(var(--accent-rgb),0.25);}
a{color:var(--blue);}

.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{width:30px;height:30px;border:1px solid var(--blue);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--blue);font-family:var(--display);font-size:14px;box-shadow:0 0 14px rgba(var(--accent-rgb),0.35) inset, 0 0 12px rgba(var(--accent-rgb),0.15);transform:rotate(45deg);}
.brand .mark span{transform:rotate(-45deg);}
.brand h1{font-family:var(--display);font-size:15px;letter-spacing:3px;font-weight:700;margin:0;color:#e9f6ff;}
.brand .sub{font-family:var(--ui);font-size:11px;letter-spacing:2px;color:var(--dim);margin-top:2px;}

.topbar-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{
  font-family:var(--ui);letter-spacing:1.5px;font-size:13px;font-weight:600;
  background:transparent;border:1px solid var(--line-soft);color:var(--dim);
  padding:8px 16px;cursor:pointer;border-radius:2px;transition:all .15s ease;
  text-transform:uppercase;
}
.tab:hover{color:var(--text);border-color:var(--line);}
.tab.active{color:var(--blue);border-color:var(--blue);box-shadow:0 0 12px rgba(var(--accent-rgb),0.18) inset;background:rgba(var(--accent-rgb),0.05);}

.acct-tag{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;}
.acct-tag b{color:var(--text);font-weight:600;}
.switch-link{background:none;border:1px solid var(--line-soft);color:var(--dim);font-family:var(--ui);font-size:10px;letter-spacing:1px;padding:5px 10px;border-radius:2px;cursor:pointer;text-transform:uppercase;}
.switch-link:hover{color:var(--blue);border-color:var(--blue);}

/* ---------- Panels ---------- */
.panel{
  position:relative;background:linear-gradient(180deg, var(--panel2), var(--panel));
  border:1px solid var(--line);border-radius:3px;padding:24px;margin-bottom:20px;
  box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 12px 40px rgba(0,0,0,0.35);
}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--blue);opacity:.7;}
.panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.panel-title{font-family:var(--ui);font-size:12px;letter-spacing:3px;color:var(--blue-dim);text-transform:uppercase;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
.panel-title::before{content:"◆";color:var(--blue);font-size:9px;}

/* ---------- Login / account screen ---------- */
.login-panel{max-width:520px;margin:50px auto 0;}
.login-panel p{color:var(--dim);font-size:13px;line-height:1.7;margin:0 0 18px;}
.profile-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.02);border:1px solid var(--line-soft);color:var(--text);padding:8px 14px 8px 8px;border-radius:22px;cursor:pointer;font-family:var(--ui);font-size:13px;transition:all .15s ease;}
.chip:hover{border-color:var(--blue);color:var(--blue);}
.chip-avatar{width:24px;height:24px;border-radius:50%;background:rgba(var(--accent-rgb),0.15);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;color:var(--blue);}

/* ---------- Status page ---------- */
.status-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
.hunter-name{font-family:var(--display);font-size:26px;color:#f2f9ff;letter-spacing:1px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
.hunter-name:hover{color:var(--blue);}
.hunter-title{font-family:var(--ui);color:var(--gold);letter-spacing:2px;font-size:13px;margin-top:4px;text-transform:uppercase;}
.rank-badge{
  font-family:var(--display);font-size:13px;letter-spacing:2px;padding:8px 18px;border-radius:2px;
  border:1px solid var(--violet);color:var(--violet);white-space:nowrap;
  box-shadow:0 0 16px rgba(139,107,255,0.25) inset;
}
.rank-badge.rk-e{border-color:#4ade80;color:#4ade80;box-shadow:0 0 16px rgba(74,222,128,0.25) inset;}
.rank-badge.rk-d{border-color:#facc15;color:#facc15;box-shadow:0 0 16px rgba(250,204,21,0.25) inset;}
.rank-badge.rk-c{border-color:#fb923c;color:#fb923c;box-shadow:0 0 16px rgba(251,146,60,0.25) inset;}
.rank-badge.rk-b{border-color:#fb7185;color:#fb7185;box-shadow:0 0 16px rgba(251,113,133,0.25) inset;}
.rank-badge.rk-a{border-color:#ffffff;color:#ffffff;box-shadow:0 0 16px rgba(255,255,255,0.25) inset;}
.rank-badge.rk-s{border-color:#60a5fa;color:#60a5fa;box-shadow:0 0 16px rgba(96,165,250,0.25) inset;}
.rank-badge.rk-ss{border-color:#3b82f6;color:#3b82f6;box-shadow:0 0 18px rgba(59,130,246,0.3) inset;}
.rank-badge.rk-nat{border-color:#a78bfa;color:#a78bfa;box-shadow:0 0 18px rgba(167,139,250,0.3) inset;}
.rank-badge.rk-shadow{
  border-color:#c084fc;color:#e9d5ff;
  background:linear-gradient(135deg,rgba(192,132,252,0.22),rgba(0,0,0,0.65));
  box-shadow:0 0 22px rgba(192,132,252,0.4) inset, 0 0 20px rgba(0,0,0,0.5);
  text-shadow:0 0 10px rgba(192,132,252,0.7);
}
.skill-card .sk-rank.rk-e{color:#4ade80;border-color:#4ade80;}
.skill-card .sk-rank.rk-d{color:#facc15;border-color:#facc15;}
.skill-card .sk-rank.rk-c{color:#fb923c;border-color:#fb923c;}
.skill-card .sk-rank.rk-b{color:#fb7185;border-color:#fb7185;}
.skill-card .sk-rank.rk-a{color:#ffffff;border-color:#ffffff;}
.skill-card .sk-rank.rk-s{color:#60a5fa;border-color:#60a5fa;}
.skill-card .sk-rank.rk-ss{color:#3b82f6;border-color:#3b82f6;}
.skill-card .sk-rank.rk-nat{color:#a78bfa;border-color:#a78bfa;}
.skill-card .sk-rank.rk-shadow{color:#e9d5ff;border-color:#c084fc;background:linear-gradient(135deg,rgba(192,132,252,0.2),rgba(0,0,0,0.6));text-shadow:0 0 8px rgba(192,132,252,0.6);}

.level-row{display:flex;align-items:baseline;gap:10px;margin-top:18px;}
.level-row .lv-label{font-family:var(--ui);font-size:12px;color:var(--dim);letter-spacing:2px;}
.level-row .lv-num{font-family:var(--display);font-size:42px;color:var(--blue);text-shadow:0 0 18px rgba(var(--accent-rgb),0.45);}

.exp-bar-outer{margin-top:14px;height:10px;border:1px solid var(--line);border-radius:2px;background:rgba(255,255,255,0.02);overflow:hidden;position:relative;}
.exp-bar-inner{height:100%;background:linear-gradient(90deg,var(--blue-dim),var(--blue));box-shadow:0 0 10px rgba(var(--accent-rgb),0.6);transition:width .4s ease;}
.exp-nums{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:14px;margin-top:22px;}
.stat-box{border:1px solid var(--line-soft);padding:12px 14px;border-radius:2px;background:rgba(255,255,255,0.015);}
.stat-box .num{font-family:var(--mono);font-size:22px;color:var(--text);font-weight:600;}
.stat-box .lbl{font-family:var(--ui);font-size:10px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;margin-top:2px;}

.name-edit-form{display:flex;gap:8px;align-items:center;}
.name-edit-form input{font-family:var(--display);font-size:20px;background:var(--panel);border:1px solid var(--blue);color:#fff;padding:6px 10px;border-radius:2px;}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--ui);letter-spacing:1.5px;font-size:13px;font-weight:600;text-transform:uppercase;
  background:rgba(var(--accent-rgb),0.08);border:1px solid var(--blue);color:var(--blue);
  padding:9px 18px;border-radius:2px;cursor:pointer;transition:all .15s ease;
}
.btn:hover{background:rgba(var(--accent-rgb),0.18);box-shadow:0 0 14px rgba(var(--accent-rgb),0.25);}
.btn.ghost{background:transparent;border-color:var(--line-soft);color:var(--dim);}
.btn.ghost:hover{color:var(--text);border-color:var(--line);}
.btn.gold{border-color:var(--gold);color:var(--gold);background:rgba(var(--gold-rgb),0.08);}
.btn.gold:hover{background:rgba(var(--gold-rgb),0.18);}
.btn.violet{border-color:var(--violet);color:var(--violet);background:rgba(139,107,255,0.08);}
.btn.violet:hover{background:rgba(139,107,255,0.18);}

/* ---------- Heatmap ---------- */
.heatmap-scroll{overflow-x:auto;padding-bottom:6px;}
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content;}
.hm-cell{width:11px;height:11px;border-radius:2px;background:rgba(255,255,255,0.04);}
.hm-cell[data-lvl="1"]{background:rgba(var(--accent-rgb),0.25);}
.hm-cell[data-lvl="2"]{background:rgba(var(--accent-rgb),0.48);}
.hm-cell[data-lvl="3"]{background:rgba(var(--accent-rgb),0.72);}
.hm-cell[data-lvl="4"]{background:var(--blue);box-shadow:0 0 6px rgba(var(--accent-rgb),0.8);}
.hm-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-family:var(--mono);font-size:10px;color:var(--dim);}

/* ---------- Forms ---------- */
label{font-family:var(--ui);font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:5px;}
select,textarea,input[type=text],input[type=number]{
  width:100%;background:rgba(255,255,255,0.02);border:1px solid var(--line-soft);color:var(--text);
  padding:10px 12px;border-radius:2px;font-family:var(--body);font-size:14px;
}
select:focus,textarea:focus,input:focus{outline:none;border-color:var(--blue);}
.field{margin-bottom:14px;}
.diff-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.diff-opt{border:1px solid var(--line-soft);border-radius:2px;padding:10px 6px;text-align:center;cursor:pointer;font-family:var(--ui);font-size:12px;letter-spacing:1px;color:var(--dim);}
.diff-opt small{display:block;font-family:var(--mono);color:var(--dim);margin-top:3px;}
.diff-opt.sel{border-color:var(--blue);color:var(--blue);background:rgba(var(--accent-rgb),0.06);}

.mode-toggle{display:flex;gap:8px;margin-bottom:18px;}
.mode-btn{font-family:var(--ui);font-size:12px;letter-spacing:1.5px;padding:9px 18px;border:1px solid var(--line-soft);background:transparent;color:var(--dim);border-radius:2px;cursor:pointer;text-transform:uppercase;}
.mode-btn.sel{border-color:var(--violet);color:var(--violet);background:rgba(139,107,255,0.08);}
.mode-btn.sel.skillmode{border-color:var(--blue);color:var(--blue);background:rgba(var(--accent-rgb),0.06);}

/* ---------- Quest log list ---------- */
.qlog-item{border-left:2px solid var(--line);padding:10px 0 10px 14px;margin-bottom:6px;}
.qlog-item.journal{border-left-color:var(--violet);}
.qlog-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.qlog-skill{font-family:var(--ui);color:var(--blue);font-size:13px;letter-spacing:1px;}
.qlog-skill.journal{color:var(--violet);}
.qlog-date{font-family:var(--mono);font-size:11px;color:var(--dim);}
.qlog-desc{font-size:13.5px;color:var(--text);margin-top:4px;line-height:1.5;white-space:pre-wrap;}
.qlog-exp{font-family:var(--mono);font-size:12px;color:var(--green);margin-top:4px;}
.qlog-exp.journal{color:var(--violet);}

/* ---------- Skills grid ---------- */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.skill-card{border:1px solid var(--line-soft);border-radius:2px;padding:14px;background:rgba(255,255,255,0.015);position:relative;}
.skill-card .sk-name{font-family:var(--ui);font-size:15px;color:#eef5ff;letter-spacing:.5px;}
.skill-card .sk-cat{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;}
.skill-card .sk-rank{position:absolute;top:14px;right:14px;font-family:var(--display);font-size:10px;letter-spacing:1px;color:var(--violet);border:1px solid var(--violet);padding:3px 8px;border-radius:2px;}
.skill-card .sk-lv{font-family:var(--mono);font-size:20px;color:var(--blue);margin-top:14px;}
.skill-card .sk-bar-outer{height:6px;border:1px solid var(--line-soft);border-radius:2px;margin-top:8px;overflow:hidden;}
.skill-card .sk-bar-inner{height:100%;background:linear-gradient(90deg,var(--blue-dim),var(--blue));}
.skill-card .sk-meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:8px;}

.empty-note{color:var(--dim);font-size:13.5px;font-family:var(--body);border:1px dashed var(--line-soft);padding:20px;border-radius:2px;text-align:center;}

/* ---------- License / certificate — "System Window" style ---------- */
.cert-stage{width:100%;display:flex;justify-content:center;margin-bottom:20px;overflow:hidden;}
.license{
  width:880px;flex:none;
  border:1px solid rgba(var(--accent-rgb),0.55);
  background:
    repeating-linear-gradient(0deg, rgba(var(--accent-rgb),0.025) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse 700px 300px at 50% 0%, rgba(var(--accent-rgb),0.07), transparent 65%),
    linear-gradient(180deg, rgba(10,16,26,0.94), rgba(4,7,13,0.97));
  position:relative;padding:34px;transform-origin:top center;
  box-shadow:
    0 0 0 1px rgba(var(--accent-rgb),0.12),
    0 0 46px rgba(var(--accent-rgb),0.16) inset,
    0 22px 60px rgba(0,0,0,0.55);
}
.license::before,.license::after{border-color:var(--blue);width:18px;height:18px;box-shadow:0 0 8px rgba(var(--accent-rgb),0.6);}
.cert-inner-frame{position:absolute;inset:10px;border:1px solid rgba(var(--accent-rgb),0.28);pointer-events:none;}
.cert-corner{position:absolute;width:14px;height:14px;border:1px solid var(--blue);opacity:.8;box-shadow:0 0 8px rgba(var(--accent-rgb),0.55);pointer-events:none;}
.cert-corner.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;}
.cert-corner.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;}
.license .panel-title::before{color:var(--blue);}
.license-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid rgba(var(--accent-rgb),0.3);padding-bottom:16px;margin-bottom:20px;}
.license-head h2{font-family:var(--display);color:var(--blue);letter-spacing:4px;font-size:16px;margin:0;text-shadow:0 0 12px rgba(var(--accent-rgb),0.6);}
.license-head .id{font-family:var(--mono);color:var(--dim);font-size:11px;margin-top:6px;}
.cert-subtitle{font-family:var(--ui);font-size:11.5px;font-style:italic;letter-spacing:.5px;color:var(--dim);margin-top:8px;}
.avatar{width:64px;height:64px;border:1px solid var(--blue);border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:26px;color:var(--blue);text-shadow:0 0 10px rgba(var(--accent-rgb),0.6);box-shadow:0 0 14px rgba(var(--accent-rgb),0.25) inset;}
.lic-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px;}
.lic-field .lbl{font-family:var(--ui);font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;}
.lic-field .val{font-family:var(--mono);font-size:16px;color:var(--blue);margin-top:3px;text-shadow:0 0 8px rgba(var(--accent-rgb),0.35);}
.lic-skills{border-top:1px solid rgba(var(--accent-rgb),0.3);padding-top:16px;}
.lic-skills .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;padding:5px 0;color:var(--text);}
.lic-skills .row span:last-child{color:var(--blue);text-shadow:0 0 6px rgba(var(--accent-rgb),0.4);}

.cert-brand-row{display:flex;align-items:center;gap:14px;}
.cert-logo{flex:none;filter:drop-shadow(0 0 8px rgba(var(--accent-rgb),0.45));}
.cert-watermark{position:absolute;right:18px;bottom:70px;opacity:0.07;pointer-events:none;}
.lic-sign-row{border-top:1px solid rgba(var(--accent-rgb),0.3);margin-top:20px;padding-top:22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.lic-sign{text-align:center;min-width:180px;}
.lic-sign .sign-name{font-family:var(--sign);font-size:34px;color:#eaf7ff;line-height:1;text-shadow:0 0 10px rgba(var(--accent-rgb),0.4);}
.lic-sign .sign-line{border-top:1px solid rgba(var(--accent-rgb),0.45);margin-top:6px;padding-top:6px;font-family:var(--ui);font-size:10.5px;letter-spacing:2px;color:var(--blue);text-transform:uppercase;}
.lic-sign .sign-role{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px;}
.lic-seal{width:70px;height:70px;border:1px solid var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;position:relative;box-shadow:0 0 16px rgba(var(--accent-rgb),0.3);}
.lic-seal::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(var(--accent-rgb),0.55);border-radius:50%;}
.lic-seal span{font-family:var(--display);font-size:9px;letter-spacing:1px;color:var(--blue);text-align:center;line-height:1.3;text-shadow:0 0 6px rgba(var(--accent-rgb),0.5);}

/* ---------- Toasts ---------- */
#toast-root{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:10px;}
.toast{
  font-family:var(--ui);letter-spacing:1px;font-size:13px;
  background:rgba(6,10,18,0.95);border:1px solid var(--blue);color:var(--blue);
  padding:12px 18px;border-radius:2px;box-shadow:0 0 24px rgba(var(--accent-rgb),0.3);
  animation:toastIn .3s ease, toastOut .4s ease 3.8s forwards;
  max-width:300px;
}
.toast.gold{border-color:var(--gold);color:var(--gold);box-shadow:0 0 24px rgba(var(--gold-rgb),0.35);}
.toast.violet{border-color:var(--violet);color:var(--violet);box-shadow:0 0 24px rgba(139,107,255,0.35);}
.toast b{display:block;font-family:var(--display);font-size:12px;letter-spacing:2px;margin-bottom:4px;}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px);}}

/* ---------- Settings ---------- */
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
.settings-row:last-child{border-bottom:none;}
.settings-row .srow-label{font-family:var(--ui);font-size:14px;color:var(--text);letter-spacing:.5px;}
.settings-row .srow-sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px;}
.theme-swatches{display:flex;gap:12px;flex-wrap:wrap;}
.theme-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;background:none;border:none;padding:0;font-family:var(--ui);font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase;}
.theme-swatch .dot{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);position:relative;transition:all .15s ease;}
.theme-swatch.sel .dot{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,0.12);}
.theme-swatch.sel{color:var(--text);}
.theme-swatch .dot.dot-blue{background:radial-gradient(circle at 35% 30%, #7ff2ff, #2a7f94);}
.theme-swatch .dot.dot-red{background:radial-gradient(circle at 35% 30%, #ff8a97, #8a2c38);}
.theme-swatch .dot.dot-green{background:radial-gradient(circle at 35% 30%, #8bffc0, #1f7a4c);}
.settings-name-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.settings-name-form input{max-width:220px;}

/* ---------- Achievements (compact) ---------- */
.ach-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.ach-chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line-soft);color:var(--dim);padding:7px 12px;border-radius:20px;font-family:var(--ui);font-size:11.5px;letter-spacing:.5px;white-space:nowrap;}
.ach-chip.unlocked{border-color:var(--gold);color:var(--gold);background:rgba(var(--gold-rgb),0.07);}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px;}
.ach-toggle{background:none;border:none;color:var(--blue);font-family:var(--ui);font-size:11.5px;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;padding:0;margin-top:10px;}
.ach-toggle:hover{text-decoration:underline;}

footer.note{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;}

@media (max-width:640px){
  .wrap{padding:18px 14px 70px;}
  .level-row .lv-num{font-size:32px;}
  .diff-row{grid-template-columns:repeat(2,1fr);}
  .topbar-right{width:100%;justify-content:space-between;}
  .tabs{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;}
  .tab{padding:8px 12px;font-size:12px;flex:none;}
  .panel{padding:16px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .settings-row{flex-direction:column;align-items:flex-start;}
}

@page{ size: landscape; margin: 10mm; }
@media print{
  html,body{background:#0b0a10 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  body *{visibility:hidden;}
  .cert-stage, .cert-stage *{visibility:visible;}
  .topbar,.no-print,footer.note{display:none !important;}
  .wrap{padding:0;max-width:100%;}
  .cert-stage{
    position:fixed;top:0;left:0;
    width:100% !important;height:auto !important;
    overflow:visible;margin:0;padding:0;
  }
  .license{
    width:100% !important;max-width:1000px;margin:0 auto;
    box-shadow:none;transform:none !important;
  }
}

<script>
(function(){
  "use strict";

  /* ---------------- storage helpers (Firestore-backed) ----------------
     Everything is now saved to Firestore under the signed-in Google
     account (uid is baked into the key via K()), so the same account
     shows the same data on any device. The old `shared` flag is kept
     in the function signature only so existing call-sites don't need
     to change, but it's unused now — Firestore doc id (the key) is
     what scopes the data. */
  async function loadKey(key, fallback, shared){
    try{
      const snap = await db.collection('appData').doc(key).get();
      if(!snap.exists) return fallback;
      const d = snap.data();
      return (d && Object.prototype.hasOwnProperty.call(d,'data')) ? d.data : fallback;
    }catch(e){ console.error('storage load failed', key, e); return fallback; }
  }
  async function saveKey(key, value, shared){
    try{ await db.collection('appData').doc(key).set({ data: value }); return true; }
    catch(e){ console.error('storage save failed', key, e); return false; }
  }

  /* ---------------- state ---------------- */
  let accounts = [];           // shared registry: [{id,name,createdAt}]
  let currentAccountId = null;
  let profile = null;          // {name, joinDate}
  let skills = [];              // {id,name,category,totalExp,createdAt}
  let entries = [];             // {id,date,skillId,skillName,description,exp,difficulty,type}
  let achievements = [];
  let state = { screen:'login', tab:'status', editingName:false, showAddSkill:false, difficulty:'normal', questMode:'skill',dailyGoal:100, showAllAchievements:false };

  /* ---------------- theme ---------------- */
  const THEME_COLORS = { blue:'#05070d', red:'#0d0507', green:'#050d09' };
  function applyTheme(theme){
    const t = (theme==='red'||theme==='green') ? theme : 'blue';
    document.documentElement.setAttribute('data-theme', t);
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if(!metaTag){ metaTag = document.createElement('meta'); metaTag.name = 'theme-color'; document.head.appendChild(metaTag); }
    metaTag.content = THEME_COLORS[t] || THEME_COLORS.blue;
  }

  function todayStr(d){ d = d || new Date(); return d.toISOString().slice(0,10); }
  function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function slugify(s){ return (s||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'').slice(0,40) || 'hunter'; }
  function K(name){ return 'acct_' + currentAccountId + '_' + name; }

  /* ---------------- leveling math ---------------- */
  function reqForLevel(level){ return 100 + (level-1)*20; }
  function levelFromExp(exp){
    let level=1, cum=0, req=reqForLevel(1);
    while(exp >= cum+req){ cum += req; level++; req = reqForLevel(level); }
    return { level, into: exp-cum, need: req, cum };
  }
  const RANKS = [
    {min:1,   name:'E-Rank',  cls:'rk-e'},
    {min:6,   name:'D-Rank',  cls:'rk-d'},
    {min:11,  name:'C-Rank',  cls:'rk-c'},
    {min:21,  name:'B-Rank',  cls:'rk-b'},
    {min:31,  name:'A-Rank',  cls:'rk-a'},
    {min:41,  name:'S-Rank',  cls:'rk-s'},
    {min:51,  name:'SS-Rank', cls:'rk-ss'},
    {min:71,  name:'National Level Hunter', cls:'rk-nat'},
    {min:100, name:'Shadow Monarch', cls:'rk-shadow'}
  ];
  function rankFromLevel(level){
    let r = RANKS[0];
    for(const item of RANKS){ if(level>=item.min) r=item; }
    return r;
  }
  const TITLES = {
    'E-Rank':'Awakened Beginner','D-Rank':'Steady Grinder','C-Rank':'Rising Hunter',
    'B-Rank':'Seasoned Hunter','A-Rank':'Elite Hunter','S-Rank':'Peak Hunter','SS-Rank':'Peak Hunter',
    'National Level Hunter':'National Level Hunter','Shadow Monarch':'Sovereign of Shadows'
  };
  const DIFF = { easy:{label:'E-Quest',exp:15}, normal:{label:'D-Quest',exp:30}, hard:{label:'B-Quest',exp:60}, epic:{label:'S-Quest',exp:120} };

  function totalExp(){ return skills.reduce((s,k)=>s+k.totalExp,0); }
  function todayXP(){

    const today = todayStr();

    return entries
        .filter(e => e.date === today)
        .reduce((sum,e)=>sum + (e.exp || 0),0);

}
  function overall(){ const exp=totalExp(); const lv=levelFromExp(exp); const rank=rankFromLevel(lv.level); return {exp,lv,rank}; }

  function hasAchievement(id){

    return achievements.includes(id);

}

  const ACHIEVEMENTS = [
    {id:'first_entry',    icon:'🏆', title:'First Quest',        check:s=>s.entryCount>=1},
    {id:'ten_entries',    icon:'🏆', title:'10 Entries',         check:s=>s.entryCount>=10},
    {id:'fifty_entries',  icon:'🏆', title:'50 Entries',         check:s=>s.entryCount>=50},
    {id:'hundred_entries',icon:'👑', title:'100 Entries',        check:s=>s.entryCount>=100},
    {id:'three_skills',   icon:'🌱', title:'3 Skills',           check:s=>s.skillCount>=3},
    {id:'five_skills',    icon:'🌿', title:'5 Skills',           check:s=>s.skillCount>=5},
    {id:'ten_skills',     icon:'🌳', title:'10 Skills',          check:s=>s.skillCount>=10},
    {id:'xp100',          icon:'⚡', title:'100 XP',             check:s=>s.xp>=100},
    {id:'xp500',          icon:'⚡', title:'500 XP',             check:s=>s.xp>=500},
    {id:'xp1000',         icon:'💠', title:'1000 XP',            check:s=>s.xp>=1000},
    {id:'xp5000',         icon:'💠', title:'5000 XP',            check:s=>s.xp>=5000},
    {id:'xp10000',        icon:'🔷', title:'10,000 XP',          check:s=>s.xp>=10000},
    {id:'streak3',        icon:'🔥', title:'3 Day Streak',       check:s=>s.streak>=3},
    {id:'streak7',        icon:'🔥', title:'7 Day Streak',       check:s=>s.streak>=7},
    {id:'streak30',       icon:'🔥', title:'30 Day Streak',      check:s=>s.streak>=30},
    {id:'streak100',      icon:'🔥', title:'100 Day Streak',     check:s=>s.streak>=100},
    {id:'level10',        icon:'⭐', title:'Level 10',           check:s=>s.level>=10},
    {id:'level25',        icon:'⭐', title:'Level 25',           check:s=>s.level>=25},
    {id:'level50',        icon:'🌟', title:'Level 50',           check:s=>s.level>=50},
    {id:'level100',       icon:'🌟', title:'Level 100',          check:s=>s.level>=100},
    {id:'rank_d',         icon:'◆', title:'Reached D-Rank',      check:s=>s.level>=6},
    {id:'rank_c',         icon:'◆', title:'Reached C-Rank',      check:s=>s.level>=11},
    {id:'rank_b',         icon:'◆', title:'Reached B-Rank',      check:s=>s.level>=21},
    {id:'rank_a',         icon:'◆', title:'Reached A-Rank',      check:s=>s.level>=31},
    {id:'rank_s',         icon:'◆', title:'Reached S-Rank',      check:s=>s.level>=41},
    {id:'rank_ss',        icon:'◆', title:'Reached SS-Rank',     check:s=>s.level>=51},
    {id:'rank_shadow',    icon:'👑', title:'Became Shadow Monarch', check:s=>s.level>=100}
  ];

  async function unlockAchievement(id,name){

    if(hasAchievement(id)) return;

    achievements.push(id);

    await saveKey(
        K("achievements"),
        achievements,
        true
    );

    toast(
        "ACHIEVEMENT",
        name,
        "gold"
    );

}
  
  async function checkAchievements(){

    const o = overall();
    const s = { xp:o.exp, entryCount:entries.length, skillCount:skills.length, streak:currentStreak(), level:o.lv.level };

    for(const a of ACHIEVEMENTS){
      if(a.check(s)) await unlockAchievement(a.id, a.title);
    }

}

  /* ---------------- streaks ---------------- */
  function dateSet(){ return new Set(entries.map(e=>e.date)); }
  function currentStreak(){
    const set = dateSet(); let d = new Date(); let count=0;
    if(!set.has(todayStr(d))){ d.setDate(d.getDate()-1); }
    while(set.has(todayStr(d))){ count++; d.setDate(d.getDate()-1); }
    return count;
  }
  function longestStreak(){
    const days = [...dateSet()].sort();
    if(!days.length) return 0;
    let best=1, cur=1;
    for(let i=1;i<days.length;i++){
      const prev = new Date(days[i-1]+'T00:00:00'), cur2 = new Date(days[i]+'T00:00:00');
      const diff = Math.round((cur2-prev)/86400000);
      if(diff===1){ cur++; } else { cur=1; }
      if(cur>best) best=cur;
    }
    return best;
  }

  /* ---------------- toasts ---------------- */
  function toast(title, msg, kind){
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' '+kind : '');
    el.innerHTML = '<b>'+esc(title)+'</b>' + esc(msg);
    root.appendChild(el);
    setTimeout(()=>{ el.remove(); }, 4300);
  }

  /* ---------------- heatmap ---------------- */
  function buildHeatmap(){
    const counts = {};
    entries.forEach(e=>{ counts[e.date] = (counts[e.date]||0)+1; });
    const today = new Date();
    const start = new Date(today);
    start.setDate(start.getDate() - 370);
    const startDow = start.getDay();
    start.setDate(start.getDate() - startDow);

    let cells = '', months = [], lastMonth = -1;
    const days = [];
    let d = new Date(start);
    while(d <= today){ days.push(new Date(d)); d.setDate(d.getDate()+1); }

    days.forEach((day, i)=>{
      const dow = day.getDay();
      if(dow===0 && day.getMonth()!==lastMonth){
        months.push({col: Math.floor(i/7), label: day.toLocaleString('en-US',{month:'short'})});
        lastMonth = day.getMonth();
      }
      const ds = todayStr(day);
      const c = counts[ds] || 0;
      let lvl = 0;
      if(c>0) lvl=1; if(c>=2) lvl=2; if(c>=4) lvl=3; if(c>=7) lvl=4;
      const future = day > today;
      cells += '<div class="hm-cell" data-lvl="'+(future?0:lvl)+'" title="'+ds+' — '+c+' entr'+(c===1?'y':'ies')+'"></div>';
    });

    let monthRow = '<div style="display:grid;grid-auto-flow:column;grid-auto-columns:14px;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:4px;width:max-content;">';
    let monthCells = new Array(Math.ceil(days.length/7)+1).fill('');
    months.forEach(m=>{ monthCells[m.col] = m.label; });
    monthCells.forEach(m=>{ monthRow += '<div style="grid-column:span 1;">'+m+'</div>'; });
    monthRow += '</div>';

    return '<div class="heatmap-scroll">' + monthRow + '<div class="heatmap">'+cells+'</div></div>';
  }

  /* ---------------- render: LOGIN ---------------- */
  function renderLogin(){

    return `
    <div class="panel login-panel">

        <div class="panel-title">
            Access Terminal
        </div>

        <p>
            Sign in with Google to continue.
            Your progress, skills, quests and level will be
            saved to your Google account and synced automatically.
        </p>

        <button
            class="btn"
            type="button"
            id="googleSignIn"
            style="display:flex;align-items:center;justify-content:center;gap:10px;width:100%;">

            <svg width="16" height="16" viewBox="0 0 48 48" style="flex:none;">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.9-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.6 3.5 24 3.5c-7.9 0-14.7 4.5-17.7 11.2z"/>
                <path fill="#4CAF50" d="M24 44.5c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.5 35.6 26.9 36.5 24 36.5c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.2 40 16 44.5 24 44.5z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.6l6.6 5.4C41.4 36 44.5 30.6 44.5 24c0-1.2-.1-2.4-.9-3.5z"/>
            </svg>

            Sign in with Google

        </button>

        <div
            style="
            margin-top:18px;
            font-family:var(--mono);
            font-size:11px;
            color:var(--dim);">

            ✓ One account works on every device.<br>
            ✓ Progress is saved automatically.<br>
            ✓ Stay signed in until you log out.

        </div>

    </div>
    `;

}


  /* ---------------- render: STATUS ---------------- */
  function renderStatus(){
    const o = overall();
    const pct = Math.min(100, Math.round((o.lv.into/o.lv.need)*100));
    const streak = currentStreak(), best = longestStreak();
    const daysSince = Math.max(1, Math.round((new Date() - new Date(profile.joinDate+'T00:00:00'))/86400000)+1);

    const nameBlock = state.editingName
      ? '<form id="name-form" class="name-edit-form"><input type="text" name="name" value="'+esc(profile.name)+'" maxlength="24" autofocus>'
        + '<button type="submit" class="btn">Save</button></form>'
      : '<div class="hunter-name" data-action="edit-name">'+esc(profile.name)+' <span style="font-size:12px;color:var(--dim);">✎</span></div>';

    return ''
    + '<div class="panel">'
      + '<div class="status-head">'
        + '<div>'+nameBlock+'<div class="hunter-title">'+esc(TITLES[o.rank.name])+'</div></div>'
        + '<div class="rank-badge '+o.rank.cls+'">'+esc(o.rank.name)+'</div>'
      + '</div>'
      + '<div class="level-row"><span class="lv-label">LEVEL</span><span class="lv-num">'+o.lv.level+'</span></div>'
      + '<div class="exp-bar-outer"><div class="exp-bar-inner" style="width:'+pct+'%"></div></div>'
      + '<div class="exp-nums"><span>'+o.lv.into+' / '+o.lv.need+' EXP</span><span>Total EXP: '+o.exp+'</span></div>'
      + '<div class="stat-grid">'
        + statBox(skills.length,'Skills')
        + statBox(entries.length,'Entries Logged')
        + statBox(streak,'Day Streak')
        + statBox(best,'Best Streak')
        + statBox(daysSince,'Days as Hunter')
      + '</div>'
    + '</div>'
    + renderDailyGoal()
    + '<div class="panel">'
      + '<div class="panel-title">Activity Monitor</div>'
      + '<div class="stat-grid" style="margin-bottom:18px;">'
        + statBox(entries.filter(e=>e.date===todayStr()).length,'Today Entries')
        + statBox(streak,'Current Streak')
        + statBox(best,'Best Streak')
        + statBox(dateSet().size,'Active Days')
      + '</div>'
      + buildHeatmap()
      + '<div class="hm-legend">Less <div class="hm-cell" data-lvl="0"></div><div class="hm-cell" data-lvl="1"></div><div class="hm-cell" data-lvl="2"></div><div class="hm-cell" data-lvl="3"></div><div class="hm-cell" data-lvl="4"></div> More</div>'
    + '</div>'
    + renderAchievements()
    + (skills.length ? '<div class="panel"><div class="panel-title">Top Skills</div>'+renderTopSkills()+'</div>' : '');
  }
  function statBox(num,lbl){ return '<div class="stat-box"><div class="num">'+num+'</div><div class="lbl">'+lbl+'</div></div>'; }
  function renderDailyGoal(){

    const xp = todayXP();

    const goal = state.dailyGoal;

    const percent = Math.min(
        100,
        Math.round((xp/goal)*100)
    );

    return `
        <div class="panel">

            <div class="panel-title">

  /* ---------------- certificate fit-to-width ----------------
     The certificate is built at a fixed design width so its
     proportions never distort — on small screens it's simply
     scaled down as one whole unit, exactly like shrinking a
     real printed certificate rather than reflowing its layout. */
  function fitCertificate(){
    const stage = document.getElementById('cert-stage');
    const panel = document.getElementById('cert-panel');
    if(!stage || !panel) return;
    panel.style.transform = 'scale(1)';
    const designWidth = panel.offsetWidth || 880;
    const stageWidth = stage.clientWidth;
    const scale = Math.min(1, stageWidth / designWidth);
    panel.style.transform = 'scale(' + scale + ')';
    stage.style.height = (panel.getBoundingClientRect().height) + 'px';
  }
  window.addEventListener('resize', function(){
    if(state.tab === 'license') fitCertificate();
  });

  appEl.addEventListener('submit', async function(e){
    e.preventDefault();
    const form = e.target;

    if(form.id === 'name-form'){
      const val = form.elements['name'].value.trim();
      if(val){ profile.name = val; await saveKey(K('profile'), profile, true); }
      state.editingName = false;
      render();
      return;
    }

    if(form.id === 'skill-form'){
      const name = form.elements['name'].value.trim();
      const category = form.elements['category'].value.trim();
      if(!name) return;
      const exists = skills.some(s=>s.name.toLowerCase()===name.toLowerCase());
      if(exists){ toast('SYSTEM','You already have this skill.'); return; }
      skills.push({ id: uid(), name, category, totalExp: 0, createdAt: todayStr() });
      await saveKey(K('skills'), skills, true);
      await checkAchievements();
      state.showAddSkill = false;
      toast('SKILL ACQUIRED', name+' has joined your Skill Tree.');
      render();
      return;
    }

    if(form.id === 'journal-form'){

      entries.push({ id: uid(), date: todayStr(), skillId: null, skillName: 'Journal', description: text, exp: 0, difficulty: 'journal', type: 'journal' });

      render();

      const skillId = form.elements['skillId'].value;
      const description = form.elements['description'].value.trim();
      const difficulty = state.difficulty;
      if(!description) return;
      let exp = DIFF[difficulty] ? DIFF[difficulty].exp : 30;
      if(difficulty === 'custom'){
        const v = parseInt(form.elements['customExp'].value, 10);
        exp = (isNaN(v) || v<1) ? 10 : Math.min(v,500);
      }
      const sk = skills.find(s=>s.id===skillId);
      if(!sk) return;

      const beforeOverall = overall();
      const beforeSkillLv = levelFromExp(sk.totalExp).level;

      sk.totalExp += exp;
      entries.push({ id: uid(), date: todayStr(), skillId: sk.id, skillName: sk.name, description, exp, difficulty, type:'skill' });

      await saveKey(K('skills'), skills, true);
      await saveKey(K('entries'), entries, true);
      await checkAchievements();

      const today = todayXP();

if(
    today >= state.dailyGoal &&
    today-exp < state.dailyGoal
){

    toast(
        "MISSION COMPLETE",
        "Daily XP Goal Completed!",
        "gold"
    );

}

      const afterOverall = overall();
      const afterSkillLv = levelFromExp(sk.totalExp).level;

      toast('QUEST COMPLETE', '+'+exp+' XP — '+sk.name);
      if(afterSkillLv > beforeSkillLv){ toast('LEVEL UP', sk.name+' reached Level '+afterSkillLv+'!'); }
      if(afterOverall.rank.name !== beforeOverall.rank.name){
        toast('RANK UP', 'You have become '+afterOverall.rank.name+'!', 'gold');
      }

      form.reset();
      state.difficulty = 'normal';
      render();
      return;
    }
  });

  async function boot(){
    applyTheme('blue');
    accounts = await loadKey('accounts_registry', [], true);
    state.screen = "login";
    render();

    // Keep the user signed in on this device/browser until they explicitly log out.
    await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    // Firebase fires this once on load with the restored session (if any),
    // and again any time sign-in/sign-out happens.
    auth.onAuthStateChanged(async function(user){
      if(user){
        const id = user.uid;
        let acc = accounts.find(a=>a.id===id);
        const name = user.displayName || user.email || 'Hunter';
        if(!acc){
          acc = { id, name, email: user.email || null, createdAt: todayStr() };
          accounts.push(acc);
          await saveKey('accounts_registry', accounts, true);
        }
        if(currentAccountId !== id){
          await enterAccount(acc.id, acc.name);
        }
      } else {
        currentAccountId = null;
        profile = null; skills = []; entries = [];
        state.screen = 'login';
        state.tab = 'status';
        render();
      }
    });
  }

            const provider = new firebase.auth.GoogleAuthProvider();
            await auth.signInWithPopup(provider);
            // onAuthStateChanged above handles entering the account.

        }catch(err){

            toast(
                "Error",
                err.message,
                "gold"
            );

        }

    }

});
  boot();
})();
</script>
</body>
</html>
